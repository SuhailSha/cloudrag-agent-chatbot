services:
  - type: web
    name: cloudrag-agent-chatbot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
